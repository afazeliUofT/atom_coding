[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiber-grand-final-potential-gate"
version = "3.0.0"
description = "Final early-investment novelty, theory, and computational gate for fixed-edit FIBER-GRAND"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
