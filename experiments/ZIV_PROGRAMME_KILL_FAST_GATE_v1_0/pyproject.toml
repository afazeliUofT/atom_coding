[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ziv-programme-kill-fast-gate"
version = "1.0.0"
description = "Rigorous theory and computation gate for the Ziv universal-guessing research programme"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "pandas>=2.1,<3",
  "matplotlib>=3.8,<4",
  "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
where = ["src"]
